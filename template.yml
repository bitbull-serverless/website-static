AWSTemplateFormatVersion: 2010-09-09
Transform: AWS::Serverless-2016-10-31

Description: "Static website using S3 and CloudFront"

Parameters:
  Project:
    Type: String
    Description: "The project name"
    Default: "example"
  Environment:
    Type: String
    Description: "The deployment environment"
    Default: "dev"
  DomainName:
    Type: String
    Description: "The domain name of website"
    Default: ""
  HostedZoneId:
    Type: String
    Description: "The Route53 hosted zone ID used for the domain, required only if DomainName is provided"
    Default: ""
  AcmCertificateArn:
    Type: String
    Description: "The certificate arn for the domain name provided, required only if DomainName is provided"
    Default: ""
  IndexDocument:
    Type: String
    Description: "The index document"
    Default: "index.html"
  ErrorDocument:
    Type: String
    Description: "The error document, ignored in SPA mode"
    Default: "404.html"
  RewriteMode:
    Type: String
    Description: "The request rewrite behaviour type"
    Default: "STATIC"
    AllowedValues:
      - STATIC
      - SPA
  RewriteExcludeRegEx:
    Type: String
    Description: "Regular expression for authentication and path rewrite exclusion"
    Default: "(/assets/|robots\\.txt$|favicon\\.ico$|favicon\\.svg$)"
  HttpAuth:
    Type: String
    Description: "Enable or disable the HTTP basic auth"
    Default: "DISABLED"
    AllowedValues:
      - ENABLED
      - DISABLED
  HttpAuthUsername:
    Type: String
    Description: "HTTP Basic Auth username"
    Default: ""
  HttpAuthPassword:
    Type: String
    Description: "HTTP Basic Auth password"
    Default: ""
    NoEcho: true
  CloudFrontPriceClass:
    Type: String
    Description: "The price class for CloudFront distribution"
    Default: "PriceClass_100"
    AllowedValues:
      - PriceClass_100
      - PriceClass_200
      - PriceClass_All
  AllowedHeaders:
    Type: CommaDelimitedList
    Description: "CORS Allowed headers"
    Default: "*"
  AllowedMethods:
    Type: CommaDelimitedList
    Description: "CORS Allowed methods"
    Default: "GET,HEAD"
  AllowedOrigins:
    Type: CommaDelimitedList
    Description: "CORS Allowed origins"
    Default: "*"
  ExposedHeaders:
    Type: CommaDelimitedList
    Description: "CORS exposed headers"
    Default: "ETag"
  AutomaticInvalidation:
    Type: String
    Description: "Automatically invalidate CloudFront distribution when S3 bucket object change"
    Default: "DISABLED"
    AllowedValues:
      - ENABLED
      - DISABLED
  CloudFrontCaching:
    Type: String
    Description: "Enable or disable CloudFront caching"
    Default: "ENABLED"
    AllowedValues:
      - ENABLED
      - DISABLED

Conditions:
  IsHostedZoneIdProvided: !Not [!Equals [!Ref HostedZoneId, ""]]
  IsStaticMode: !Equals [!Ref RewriteMode, "STATIC"]
  IsAutomaticInvalidationEnabled: !Equals [!Ref AutomaticInvalidation, "ENABLED"]
  IsCachingEnabled: !Equals [!Ref CloudFrontCaching, "ENABLED"]
  IsHttpAuthEnabled: !Equals [!Ref HttpAuth, "ENABLED"]
  NeedsEventBridge: !Or [!Condition IsAutomaticInvalidationEnabled, !Condition IsHttpAuthEnabled]
  IsDomainProvided: !Not [!Equals [!Ref DomainName, ""]]

Resources:
  DnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: IsHostedZoneIdProvided
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: "Z2FDTNDATAQYW2" # CloudFront fixed hosted zone id

  Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${Project}-${Environment}-site"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: !Ref AllowedHeaders
            AllowedMethods: !Ref AllowedMethods
            AllowedOrigins: !Ref AllowedOrigins
            ExposedHeaders: !Ref ExposedHeaders
            MaxAge: "3600"
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: !If [NeedsEventBridge, true, false]

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Bucket
      PolicyDocument:
        Statement:
          - Effect: "Allow"
            Action: "s3:GetObject"
            Resource: !Sub "arn:aws:s3:::${Bucket}/*"
            Principal:
              AWS: !Sub "arn:aws:iam::cloudfront:user/CloudFront Origin Access Identity ${OriginAccessIdentity}"

  OriginAccessIdentity:
    Type: AWS::CloudFront::CloudFrontOriginAccessIdentity
    Properties:
      CloudFrontOriginAccessIdentityConfig:
        Comment: !Sub "${Project}-${Environment}"

  CredentialsKeyValueStore:
    Type: AWS::CloudFront::KeyValueStore
    Properties:
      Name: !Sub "${Project}-${Environment}-credentials"
      Comment: !Sub "Per-subdomain HTTP Basic Auth credentials for ${Project}-${Environment}"

  RequestRouterFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${Project}-${Environment}-req-router"
      AutoPublish: true
      FunctionCode: !Sub
        - |
          import cf from 'cloudfront';
          var kvsHandle = cf.kvs('${CredentialsKeyValueStoreId}');
          var rewriteMode = '${RewriteMode}';
          var isAuthEnabled = '${HttpAuth}' === 'ENABLED';
          var globalAuthToken = '${HttpAuthTokenEncoded}';
          var responseUnauthorized = {
            statusCode: 401,
            statusDescription: "Unauthorized",
            headers: {
              'www-authenticate': { value: 'Basic realm="Login Required", charset="UTF-8"' }
            }
          };

          async function handler(event) {
            var request = event.request;
            var host = request.headers.host ? request.headers.host.value : '';
            var domainName = '${DomainName}';
            var originalUri = request.uri;
            var subdomainPrefix = '';
            var subdomain = null;

            if (domainName.indexOf('*.') === 0) {
              var baseDomain = domainName.substring(2);
              if (host.length > baseDomain.length && host.indexOf('.' + baseDomain) === (host.length - baseDomain.length - 1)) {
                var candidate = host.substring(0, host.length - baseDomain.length - 1);
                if (candidate !== 'www') {
                  subdomain = candidate;
                  subdomainPrefix = '/' + subdomain;
                  if (request.uri !== subdomainPrefix && request.uri.indexOf(subdomainPrefix + '/') !== 0) {
                    request.uri = subdomainPrefix + request.uri;
                  }
                }
              }
            }

            var uri = request.uri;

            if (uri.match('${RewriteExcludeRegEx}') !== null) {
              console.log('detected excluded path, skip');
              return request;
            }

            var effectiveAuthEnabled = isAuthEnabled;
            var effectiveAuthToken = globalAuthToken;

            if (subdomain) {
              try {
                var kvsValue = await kvsHandle.get(subdomain);
                if (kvsValue) {
                  effectiveAuthEnabled = true;
                  effectiveAuthToken = kvsValue;
                }
              } catch (e) {
                console.log('no KVS entry for ' + subdomain + ', using global auth settings');
              }
            }

            if (effectiveAuthEnabled) {
              var providedAuth = request.headers.authorization;
              if (!providedAuth || !providedAuth.value) {
                console.log('auth token not provided, return unauthorized response');
                return responseUnauthorized;
              }
              if (providedAuth.value !== ('Basic ' + effectiveAuthToken)) {
                console.log('wrong auth token, return unauthorized response');
                return responseUnauthorized;
              }
            } else {
              console.log('auth not enabled, skip');
            }

            if (rewriteMode === 'STATIC') {
              if (!uri.endsWith('.html')) {
                if (originalUri !== '/' && !originalUri.endsWith('/')) {
                  console.log('redirecting to trailing slash: ' + originalUri + '/');
                  return {
                    statusCode: 301,
                    statusDescription: 'Moved Permanently',
                    headers: {
                      'location': { value: originalUri + '/' }
                    }
                  };
                }
                request.uri += '${IndexDocument}';
                console.log('path rewritten for static to ' + request.uri);
              } else {
                console.log('path not rewritten, used as it for static');
              }
            } else if (rewriteMode === 'SPA') {
              request.uri = '/${IndexDocument}';
              console.log('path rewritten for SPA to ' + request.uri);
            }

            return request;
          }
        - HttpAuthTokenEncoded:
            Fn::Base64: !Sub "${HttpAuthUsername}:${HttpAuthPassword}"
          RewriteMode: !Ref RewriteMode
          HttpAuth: !Ref HttpAuth
          RewriteExcludeRegEx: !Ref RewriteExcludeRegEx
          DomainName: !Ref DomainName
          CredentialsKeyValueStoreId: !GetAtt CredentialsKeyValueStore.Id
      FunctionConfig:
        Comment: "Check request authentication and rewrite requests"
        Runtime: cloudfront-js-2.0
        KeyValueStoreAssociations:
          - KeyValueStoreARN: !GetAtt CredentialsKeyValueStore.Arn

  InvalidationFunction:
    Type: AWS::Serverless::Function
    Condition: IsAutomaticInvalidationEnabled
    Properties:
      FunctionName: !Sub "${Project}-${Environment}-cf-invalidate"
      Handler: index.handler
      Runtime: "nodejs22.x"
      MemorySize: 256
      Timeout: 30
      InlineCode: !Sub |
        const { CloudFrontClient, CreateInvalidationCommand } = require("@aws-sdk/client-cloudfront");
        const cloudfront = new CloudFrontClient();

        const CF_DISTRIBUTION_ID = process.env.CF_DISTRIBUTION_ID;

        exports.handler = async (event) => {
        	  console.log('S3 event', JSON.stringify(event))

            const bucket = event['detail']['bucket']['name']
            let key = decodeURIComponent(event['detail']['object']['key'])
            if (!key.startsWith('/')) key = '/' + key

            console.log("Creating invalidation for " + key + " on Cloudfront distribution " + CF_DISTRIBUTION_ID)

            const params = {
              DistributionId: CF_DISTRIBUTION_ID,
              InvalidationBatch: {
                CallerReference: String(Date.now()),
                Paths: {
                  Quantity: 1,
                  Items: [key]
                }
              }
            };

            try {
              const invalidation = await cloudfront.send(new CreateInvalidationCommand(params));
              console.log("Submitted invalidation. ID " + invalidation.Invalidation.Id + " Status " + invalidation.Invalidation.Status);
            } catch (e) {
                console.log("Error processing object " + key + " from bucket " + bucket, e)
            }
        }
      Environment:
        Variables:
          CF_DISTRIBUTION_ID: !GetAtt Distribution.Id
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - 'cloudfront:CreateInvalidation'
              Resource: '*'
      Events:
        S3Event:
          Type: EventBridgeRule
          Properties:
            Pattern:
              source:
                - "aws.s3"
              detail-type:
                - "Object Created"
                - "Object Deleted"
              detail:
                bucket:
                  name: [!Ref Bucket]

  CredentialsSyncFunction:
    Type: AWS::Serverless::Function
    Condition: IsHttpAuthEnabled
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: "es2022"
        Format: esm
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - index.mjs
        External:
          - "@aws-sdk/client-s3"
        Banner:
          - js=import { createRequire } from 'module'; const require = createRequire(import.meta.url);
    Properties:
      FunctionName: !Sub "${Project}-${Environment}-credentials-sync"
      CodeUri: functions/credentials-sync/
      Handler: index.handler
      Runtime: "nodejs22.x"
      MemorySize: 256
      Timeout: 30
      Environment:
        Variables:
          KVS_ARN: !GetAtt CredentialsKeyValueStore.Arn
          BUCKET_NAME: !Ref Bucket
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - 's3:GetObject'
              Resource: !Sub "arn:aws:s3:::${Bucket}/credentials.txt"
            - Effect: Allow
              Action:
                - 'cloudfront-keyvaluestore:DescribeKeyValueStore'
                - 'cloudfront-keyvaluestore:ListKeys'
                - 'cloudfront-keyvaluestore:PutKey'
                - 'cloudfront-keyvaluestore:DeleteKey'
              Resource: !GetAtt CredentialsKeyValueStore.Arn
      Events:
        CredentialsFileEvent:
          Type: EventBridgeRule
          Properties:
            Pattern:
              source:
                - "aws.s3"
              detail-type:
                - "Object Created"
              detail:
                bucket:
                  name: [!Ref Bucket]
                object:
                  key: ["credentials.txt"]

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: 'true'
        Comment: !Sub "${Project}-${Environment}"
        DefaultRootObject: !Ref IndexDocument
        HttpVersion: http2
        CustomErrorResponses:
          - ErrorCachingMinTTL: 86400 # cache errors for 24h
            ErrorCode: 403 # object not found in bucket
            ResponseCode: !If [IsStaticMode, 404, 200]
            ResponsePagePath: !If [IsStaticMode, !Sub "/${ErrorDocument}", !Sub "/${IndexDocument}"]
        Origins:
          - DomainName: !Sub "${Bucket}.s3.${AWS::Region}.amazonaws.com"
            Id: bucketOrigin
            S3OriginConfig:
              OriginAccessIdentity: !Sub origin-access-identity/cloudfront/${OriginAccessIdentity}
        DefaultCacheBehavior:
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          TargetOriginId: bucketOrigin
          ViewerProtocolPolicy: redirect-to-https
          OriginRequestPolicyId: 88a5eaf4-2fd4-4709-b370-b4c650ea3fcf # CORS-S3Origin - add S3 required header to origin request
          CachePolicyId: !If [IsCachingEnabled, 658327ea-f89d-4fab-a63d-7e88639e58f6, 4135ea2d-6df8-44a3-9df3-4b5a84be39ad] # CachingOptimized / CachingDisabled
          ResponseHeadersPolicyId: eaab4381-ed33-4a86-88ca-d9558dc6cd63 # CORS-with-preflight-and-SecurityHeadersPolicy - add cors management and add security headers
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt RequestRouterFunction.FunctionMetadata.FunctionARN
        PriceClass: !Ref CloudFrontPriceClass
        Aliases:
          - !If [IsDomainProvided, !Ref DomainName, !Ref "AWS::NoValue"]
        ViewerCertificate:
          CloudFrontDefaultCertificate: !If [IsDomainProvided, !Ref "AWS::NoValue", true]
          AcmCertificateArn: !If [IsDomainProvided, !Ref AcmCertificateArn, !Ref "AWS::NoValue"]
          SslSupportMethod: !If [IsDomainProvided, "sni-only", !Ref "AWS::NoValue"]

Outputs:
  BucketName:
    Description: "The S3 bucket name where HTML files need to be uploaded"
    Value: !Ref Bucket
  CloudFrontDistributionId:
    Description: "The CloudFront distribution ID in front of the S3 bucket"
    Value: !Ref Distribution
  WebsiteUrl:
    Description: "The website URL"
    Value: !If [IsDomainProvided, !Sub "https://${DomainName}/", !Sub "https://${Distribution.DomainName}/"]
